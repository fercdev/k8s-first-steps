apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: mysql-sts

spec:
  serviceName: "mysql"

  replicas: 2

  selector:
    matchLabels:
      app: mysql
  
  template:
    metadata:
      labels:
        app: mysql

    spec:
      containers:
        - name: mysql-container
          image: mysql:8
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "rootpassword"