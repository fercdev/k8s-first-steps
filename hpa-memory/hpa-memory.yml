apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hpa-memory

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hpa-memory

  minReplicas: 1
  maxReplicas: 4

  metrics:
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 60