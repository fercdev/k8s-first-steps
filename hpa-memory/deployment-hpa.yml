apiVersion: apps/v1
kind: Deployment
metadata:
  name: hpa-memory
spec:
  selector:
    matchLabels:
      app: hpa-memory
  template:
    metadata:
      labels:
        app: hpa-memory
    spec:
      containers:
      - name: hpa-memory
        image: polinux/stress

        command: ["stress"]
        args:
          - "--vm"
          - "1"
          - "--vm-bytes"
          - "250M"
          - "--vm-hang"
          - "1"

        resources:
          requests:
            memory: "200Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
