apiVersion: v1
kind: Namespace
metadata:
  name: desarrollo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role

metadata:
  name: pod-reader
  namespace: desarrollo

rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-reader-binding
  namespace: desarrollo


subjects:
  - kind: User
    name: Luis

roleRef:
  kind: Role
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io