apiVersion: v1
kind: ServiceAccount

metadata:
  name: pod-reader-sa
  namespace: lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role

metadata:
  name: pod-reader-lab
  namespace: lab

rules:
  - apiGroups: [""]
    resources: ["pods", "secrets"]
    verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding

metadata:
  name: pod-reader-binding
  namespace: lab

subjects:
  - kind: ServiceAccount
    name: pod-reader-sa
    namespace: lab
  
roleRef:
  kind: Role
  name: pod-reader-lab
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Pod

metadata:
  name: pod-reader
  namespace: lab

spec:
  serviceAccountName: pod-reader-sa
  containers:
    - name: kubectl-container
      image: bitnami/kubectl:latest
      command: ["sleep", "3600"]