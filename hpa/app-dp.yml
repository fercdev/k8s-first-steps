apiVersion: apps/v1
kind: Deployment

metadata:
  name: hpa-demo

spec:
  replicas: 2

  selector:
    matchLabels:
      app: hpa-demo
  template:
    metadata:
      labels:
        app: hpa-demo
    spec:
      containers:
        - name: hpa-demo
          image: nginx:alpine
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          ports:
            - containerPort: 80