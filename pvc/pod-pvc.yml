apiVersion: v1
kind: Pod

metadata:
  name: nginx-storage

spec:
  containers:
    - name: nginx-container
      image: nginx:alpine
      volumeMounts:
        - name: data-volume
          mountPath: /usr/share/nginx/html
  volumes:
    - name: data-volume
      persistentVolumeClaim:
        claimName: my-pvc