apiVersion: v1
kind: Namespace
metadata:
  name: webproject
---
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: webproject
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "rootpass"
  DB_PASSWORD: "demo_pass"
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mysql-pv
  namespace: webproject
spec:
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /mnt/webproject/data/mysql
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  namespace: webproject
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-service
  namespace: webproject
spec:
  selector:
    app: mysql
  ports:
    - protocol: TCP
      port: 3306
      targetPort: 3306
  type: ClusterIP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql-statefulset
  namespace: webproject

spec:
  serviceName: "mysql-service"
  replicas: 1

  selector:
    matchLabels:
      app: mysql
  
  template:
    metadata:
      labels:
        app: mysql
        service: mysql-service
        environment: test
        team: devops
        version: "1.0"
    spec:
      containers:
        - name: mysql-container
          image: fercdevv/mysql-project-paths:latest
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              value: demo_db

            - name: MYSQL_USER
              value: demo_user
            
            - name: MYSQL_PASSWORD_FILE_PATH
              value: /var/run/secrets/MYSQL_PASSWORD
            
            - name: MYSQL_ROOT_PASSWORD_FILE_PATH
              value: /var/run/secrets/MYSQL_ROOT_PASSWORD
          
          resources:
            requests:
              memory: "256Mi"
              cpu: "500m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          
          volumeMounts:
            - name: mysql-storage
              mountPath: /var/lib/mysql
            
            - name: mysql-secret-volume
              mountPath: /var/run/secrets
              readOnly: true
          
          # livenessProbe:
          #   exec:
          #     command:
          #       - mysqladmin
          #       - ping
          #       - -h
          #       - localhost
          #       - -p
          #       - $MYSQL_ROOT_PASSWORD
          #   initialDelaySeconds: 15
          #   periodSeconds: 10
          #   timeoutSeconds: 5
          #   failureThreshold: 3
      volumes:
        - name: mysql-storage
          persistentVolumeClaim:
            claimName: mysql-pvc
        - name: mysql-secret-volume
          secret:
            secretName: mysql-secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: webproject
  labels:
    app: backend

spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  
  template:
    metadata:
      labels:
        app: backend
        service: backend
        environment: test
        team: devops
        version: "1.0"
    spec:
      containers:
        - name: backend-container
          image: fercdevv/backend-project-secret:2.0
          ports:
            - containerPort: 4000
          env:
            - name: DB_HOST
              value: mysql-service

            - name: DB_PORT
              value: "3306"

            - name: DB_NAME
              value: demo_db

            - name: DB_USER
              value: demo_user
            
            - name: DB_PASSWORD_FILE_PATH
              value: /var/run/secrets/MYSQL_PASSWORD
          
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          
          volumeMounts:
            - name: mysql-secret-volume
              mountPath: /var/run/secrets
              readOnly: true
      volumes:
        - name: mysql-secret-volume
          secret:
            secretName: mysql-secret
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: webproject
spec:
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 4000
      targetPort: 4000
      nodePort: 30080
    