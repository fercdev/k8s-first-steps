apiVersion: v1
kind: Pod

metadata:
  name: nginx-config-file

spec:
  containers:
    - name: nginx-config
      image: nginx:alpine
      ports:
        - containerPort: 80
      volumeMounts:
        - name: custom-config
          mountPath: /usr/share/nginx/html
  volumes:
    - name: custom-config
      configMap:
        name: nginx-config
          